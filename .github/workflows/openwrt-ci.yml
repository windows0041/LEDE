name: OpenWrt-CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSES/**'
  schedule:
    - cron: 0 20 * * *

permissions:
  contents: read

concurrency:
  group: openwrt-x86-64
  cancel-in-progress: false

jobs:

  build_openwrt:

    name: Build x86/64 Firmware

    runs-on: ubuntu-22.04

    timeout-minutes: 350

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout OpenWrt
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load x86/64 configuration
        run: |
          cp x86_64.config .config
          make defconfig
          echo "======================="
          echo "Target / profile:"
          echo "======================="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE|ARCH_PACKAGES)=' .config
          grep -E '^CONFIG_(GRUB_IMAGES|GRUB_EFI_IMAGES|ISO_IMAGES|TARGET_IMAGES_GZIP)=' .config
          echo "======================="
          echo "LuCI:"
          echo "======================="
          grep -cE '^CONFIG_PACKAGE_luci' .config || true
          grep -E '^CONFIG_PACKAGE_luci(-app-ttyd|-i18n-base-zh-cn)?=' .config || true

      - name: Download packages
        run: make download -j16 || make download -j4

      - name: Compile firmware
        run: |
          make -j$(nproc)
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Show build errors
        if: failure()
        run: |
          echo "======================="
          echo "Last package logs:"
          echo "======================="
          for f in $(ls -t logs/*.txt 2>/dev/null | head -3); do
            echo "---- $f ----"
            tail -60 "$f"
          done
          for f in $(find logs -path '*package*' -name '*.txt' 2>/dev/null | tail -3); do
            echo "---- $f ----"
            tail -40 "$f"
          done

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/firmware
          mkdir -p ./artifact/buildinfo
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -fv ./bin/targets/x86/64/*.img.gz ./artifact/firmware/ || true
          cp -fv ./bin/targets/x86/64/*.iso ./artifact/firmware/ || true
          cp -fv ./bin/targets/x86/64/*.vmdk ./artifact/firmware/ || true
          cp -fv ./bin/targets/x86/64/sha256sums ./artifact/firmware/ || true
          cp -fv ./bin/targets/x86/64/*.buildinfo ./artifact/buildinfo/ || true
          cp -fv ./bin/targets/x86/64/*.manifest ./artifact/buildinfo/ || true
          echo "======================="
          ls -lh ./artifact/firmware
          echo "======================="
          (cd ./artifact/firmware && sha256sum * 2>/dev/null || true)

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: x86-64-buildinfo
          path: ./artifact/buildinfo/
          retention-days: 30

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: x86-64-firmware
          path: ./artifact/firmware/
          retention-days: 30
